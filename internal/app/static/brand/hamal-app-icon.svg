<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="400" height="400">
  <!-- Soft App Squircle Container -->
  <rect width="200" height="200" rx="44" fill="#141312"/>
  
  <!-- Path Mark (Scaled to 100x100 space and centered) -->
  <g transform="translate(50, 50)">
    <!-- Thicker stroke for app icon legibility -->
    <path d="M 20 75 L 40 75 L 60 35 L 80 35" fill="none" stroke="#F59E0B" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="20" cy="75" r="9" fill="#F59E0B"/>
    <circle cx="80" cy="35" r="9" fill="#F59E0B"/>
    <!-- Cargo Knockout adjusted to match dark background -->
    <rect x="40" y="45" width="20" height="20" rx="4" fill="#F59E0B" stroke="#141312" stroke-width="5" transform="rotate(45 50 55)"/>
  </g>
</svg>
